x-app-env: &app-env
  POSTGRES_HOST: postgres
  REDIS_HOST: redis
  REDIS_PORT: 6379

x-app-depends: &app-depends
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  migrate:
    condition: service_completed_successfully

services:
  fastapi:
    container_name: pulsewatch_api
    build: .
    expose:
      - "8000"
    networks:
      - pulse_watch_network
    env_file:
      - .env
    environment:
      <<: *app-env
    depends_on: *app-depends
    volumes:
      - static_volume:/app/static
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: postgres_pulse_watch_service
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - pulse_watch_network
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_NAME}"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis_pulse_watch
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}", "--appendonly", "yes"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    networks:
      - pulse_watch_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  migrate:
    build: .
    command: alembic upgrade head
    networks:
      - pulse_watch_network
    env_file:
      - .env
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  celery-monitor:
    container_name: celery_monitor_endpoint
    build: .
    command: celery -A app.tasks.celery_app.celery_app worker --loglevel=info --pool=eventlet --autoscale=10,3 -Q monitors
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    networks:
      - pulse_watch_network
    env_file:
      - .env
    environment:
      <<: *app-env
    depends_on: *app-depends
    restart: unless-stopped

  celery-beat:
    container_name: celery_beat
    build: .
    command: celery -A app.tasks.celery_app.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    networks:
      - pulse_watch_network
    env_file:
      - .env
    environment:
      <<: *app-env
    depends_on: *app-depends
    restart: unless-stopped

  celery-email:
    container_name: celery_email_worker
    build: .
    command: celery -A app.tasks.celery_app.celery_app worker --loglevel=info -Q emails --concurrency=4
    networks:
      - pulse_watch_network
    env_file:
      - .env
    environment:
      <<: *app-env
    depends_on: *app-depends
    restart: unless-stopped

  db_test:
    image: postgres:17-alpine
    container_name: postgres_pulse_watch_service_test
    profiles: ["test"]
    environment:
      POSTGRES_USER: ${TESTS_POSTGRES_USER}
      POSTGRES_PASSWORD: ${TESTS_POSTGRES_PASSWORD}
      POSTGRES_DB: ${TESTS_POSTGRES_NAME}
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data

volumes:
  pgdata:
    driver: local
  redis_data:
  static_volume:

networks:
  pulse_watch_network:
    name: pulse_watch_network
    driver: bridge
