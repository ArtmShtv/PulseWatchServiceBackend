services:
  postgres:
    image: postgres:17-alpine
    container_name: postgres_pulse_watch_service
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/pgdata
    networks:
      - pulse_watch_network
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_NAME}"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s

  redis:
    image: redis:latest
    container_name: redis_pulse_watch
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - pulse_watch_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  fastapi:
    container_name: pulsewatch_api
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    networks:
      - pulse_watch_network
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app

  migrate:
    build: .
    command: alembic upgrade head
    networks:
      - pulse_watch_network
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
    depends_on:
      postgres:
        condition: service_healthy

  celery-monitor:
    container_name: celery_monitor_endpoint
    build: .
    command: celery -A app.tasks.celery_app.celery_app worker --loglevel=info --pool=eventlet --concurrency=200 -Q monitors
    networks:
      - pulse_watch_network
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - POSTGRES_HOST=postgres
      - POSTGRES_NAME=${POSTGRES_NAME}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    container_name: celery_beat
    build: .
    command: celery -A app.tasks.celery_app.celery_app beat --loglevel=info
    networks:
      - pulse_watch_network
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - POSTGRES_HOST=postgres
      - POSTGRES_NAME=${POSTGRES_NAME}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-email:
    container_name: celery_email_worker
    build: .
    command: celery -A app.tasks.celery_app.celery_app worker --loglevel=info -Q emails --concurrency=4
    networks:
      - pulse_watch_network
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - POSTGRES_HOST=postgres
      - POSTGRES_NAME=${POSTGRES_NAME}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - SENDER_EMAIL=${SENDER_EMAIL}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
    driver: local
  redis_data:

networks:
  pulse_watch_network:
    name: pulse_watch_network
    driver: bridge