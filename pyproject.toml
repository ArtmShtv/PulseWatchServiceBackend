[project]
name = "pulsewatch"
version = "0.1.0"
description = ""
authors = [
    {name = "Artem Shitov",email = "artemshitov1985@gmail.com"}
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1,<0.142.0",
    "uvicorn>=0.52.4,<0.53.0",
    "requests>=2.34.2,<3.0.0",
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "sqlalchemy>=2.0.52",
    "pydantic-settings>=2.15.0",
    "pydentic>=0.0.1.dev3",
    "psycopg[binary]>=3.3.5",
    "authx>=1.7.1",
    "python-jose>=3.5.0",
    "passlib>=1.7.4",
    "pwdlib[argon2]>=0.3.1",
    "argon2-cffi>=25.1.0",
    "email-validator>=2.3.0",
    "python-multipart>=0.0.32",
    "pyjwt>=2.13.0",
    "redis>=8.1.0",
    "celery>=5.6.3",
    "psycopg2-binary>=2.9.12",
    "eventlet>=0.41.2",
]


[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"


[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Security",
]


[tool.ruff.lint.per-file-ignores]
"app/db/models/__init__.py" = ["F401"]