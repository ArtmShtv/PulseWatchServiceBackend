name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install ruff

      - name: Lint
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    #   redis:
    #     image: redis:7-alpine
    #     ports:
    #       - 6379:6379
    #     options: >-
    #       --health-cmd "redis-cli ping"
    #       --health-interval 5s
    #       --health-timeout 5s
    #       --health-retries 10

    env:
      SECRET_KEY: ci-only-secret

      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_NAME: app_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test

      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_PASSWORD: ci-fake-redis-password

      SENDER_EMAIL: ci@example.com
      EMAIL_PASSWORD: ci-fake-password

      TESTS_POSTGRES_HOST: localhost
      TESTS_POSTGRES_PORT: 5432
      TESTS_POSTGRES_USER: test
      TESTS_POSTGRES_PASSWORD: test
      TESTS_POSTGRES_NAME: app_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check dependencies
        run: python -m pip check

      - name: Run tests
        run: python -m pytest -v